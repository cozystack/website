# Pinned upstream-tool versions for the Cozystack v1.6 docs.
#
# Snapshotted from data/versions/next.yaml by hack/release_next.sh when v1.6
# was released. 'make update-all' does not rewrite it; patch releases
# update it by hand (hack/release-checklist.md).

# Cozystack release the docs are pinned to.
cozystack_version: "1.6.0"
cozystack_tag:     "v1.6.0"

# Talos version shipped by the Cozystack installer for this minor.
talos:       "v1.13.6"
talos_minor: "v1.13"           # the docs minor used by talos.dev URLs
