{{ $_hugo_config := `{ "version": 1 }` -}}
<section class="screenshot-gallery cz-shots">
  <div class="container">
    <h2 class="visually-hidden">{{ T "home_screenshots" }}</h2>

    <div id="galleryCarousel" class="carousel slide" data-bs-ride="false">
      <div class="carousel-inner cz-shots__frame">
        {{- range $idx, $n := seq 16 }}
        <div class="carousel-item{{ if eq $idx 0 }} active{{ end }}">
          <img src="/img/carousel/{{ $n }}.png" class="screenshot-img" alt="Screenshot {{ $n }}"{{ if gt $idx 0 }} loading="lazy"{{ end }}>
        </div>
        {{- end }}
      </div>
      <div class="cz-shots__bar">
        <div class="carousel-indicators" aria-label="Screenshot navigation">
          {{- range $idx, $n := seq 16 }}
          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="{{ $idx }}"{{ if eq $idx 0 }} class="active" aria-current="true"{{ end }} aria-label="Slide {{ $n }}"></button>
          {{- end }}
        </div>
        <div class="cz-shots__nav">
          <button class="cz-iconbtn" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev" aria-label="Previous">
            {{ with resources.Get "icons/ui/arrow-left.svg" }}{{ .Content | safeHTML }}{{ end }}
          </button>
          <button class="cz-iconbtn" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next" aria-label="Next">
            {{ with resources.Get "icons/ui/arrow-right.svg" }}{{ .Content | safeHTML }}{{ end }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
