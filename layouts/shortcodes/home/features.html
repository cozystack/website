{{ $features := $.Page.Params.features -}}
<section class="cz-features">
  <div class="container">
    <h2 class="cz-section-title">{{ T "home_features" }}</h2>
    <div class="cz-cols">
      {{ range $features -}}
      {{ $icon := .icon }}
      <article class="cz-col">
        <span class="cz-col__icon" aria-hidden="true">{{ with resources.Get (printf "icons/home/%s.svg" $icon) }}{{ .Content | safeHTML }}{{ end }}</span>
        <h3 class="cz-col__title">{{ .title | markdownify }}</h3>
        <div class="cz-col__text">{{ .description | markdownify }}</div>
      </article>
      {{ end }}
    </div>
  </div>
</section>
