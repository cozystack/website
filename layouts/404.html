{{ define "main"}}
<script>
(function() {
  // The live demo (/demo-app/) is a single-page app. Pages has no fallback for
  // it, so reloading the demo on any inner screen lands here; hand the route
  // back to the app, which restores it before rendering.
  var demo = '/demo-app/';
  var path = window.location.pathname;
  if (path.indexOf(demo) === 0 && path !== demo) {
    var route = path.slice(demo.length - 1) + window.location.search + window.location.hash;
    window.location.replace(demo + '?demoRoute=' + encodeURIComponent(route));
    return;
  }

  var latest = {{ printf "%q" .Site.Params.latest_version_id | safeJS }};
  var m = latest.match(/^(v\d+)\./);
  if (m) {
    var shortPrefix = '/docs/' + m[1] + '/';
    var fullPrefix = '/docs/' + latest + '/';
    if (window.location.pathname.indexOf(shortPrefix) === 0) {
      window.location.replace(window.location.pathname.replace(shortPrefix, fullPrefix));
      return;
    }
  }
})();
</script>
<main id="main">
  <div class="d-flex justify-content-center">
    <div class="page404">
      <h1 id="title">Sorry, page not found ... 🤷</h1>
        <h3>Were you looking for?</h3>
        <div class="links404">
          <a href="/docs">Documentation</a>
          <a href="/blog">Blog</a>
          <a href="/support">Support</a>
          <a href="/roadmap">Roadmap</a>
        </div>

      <div class="search404">
        <h3>Something else...</h3>
        <div class="docsearch-placeholder"></div>
      </div>
    </div>
  </div>
</main>

{{ end }}
