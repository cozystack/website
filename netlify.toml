[build]
  publish = "public"
  command = "npm install && ./hack/download_openapi.sh && hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_EXTENDED = "true"
  NODE_VERSION = "22"
  GO_VERSION = "1.23"

[context.production.environment]
  HUGO_ENV = "production"

# Deploy previews render content/en/docs/next/ so reviewers can see upcoming-release
# docs. HUGO_ENV != "production" skips config/production/hugo.yaml, which is where
# the `docs/next/**` content-mount exclusion lives.
[context.deploy-preview.environment]
  HUGO_ENV = "preview"

[context.deploy-preview]
  command = "npm install && ./hack/download_openapi.sh && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm install && ./hack/download_openapi.sh && hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[redirects]]
  from = "/docs/v1/*"
  to = "/docs/v1.2/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Bluesky/AT Protocol handle verification for @cozystack.io. The spec asks for
# text/plain, and an extensionless file does not get that by default.
#
# This only affects deploy previews: production is GitHub Pages, which serves
# extensionless files as application/octet-stream and offers no way to set
# response headers. Handle resolution still works there — neither the TypeScript
# (@atproto/identity) nor the Go (indigo) resolver inspects Content-Type; both
# require a 2xx status and a body whose first line parses as a DID.
[[headers]]
  for = "/.well-known/atproto-did"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
